# Single-package repo; this file only carries pnpm's install policy.
onlyBuiltDependencies:
  - esbuild
  - sharp
minimumReleaseAge: 1440
# Security patches for transitive dev/CI tooling (pnpm audit); drop each once its parent updates.
overrides:
  'undici@>=7.0.0 <7.30.1': '>=7.30.1 <8'
  'tmp@<0.2.6': '^0.2.6'
  'uuid@<11.1.1': '^11.1.1'
  'basic-ftp@<6.2.1': '^6.2.1'
  '@esbuild-kit/core-utils>esbuild': '^0.25.0'
# Accepted dev-only advisories. The first three sit under @lhci/cli > lighthouse > puppeteer-core,
# used only by the CI Lighthouse run against our own build, never deployed:
# - GHSA-jmr9-qjv8-65gv, GHSA-7pqw-9j4j-h8q3 (extract-zip <=2.0.1, no fixed version): it only
#   unpacks browser downloads from Chrome's own CDN, and Lighthouse uses the runner's Chrome.
# - GHSA-mrhx-c7xc-m3w5 (zod 3 in chromium-bidi, fixed only in zod 4, which it does not accept):
#   it validates messages from the local browser, not untrusted input.
# - GHSA-g3hv-75wg-m249 (minimatch <11.0.1, ReDoS-style amplification): reached only through
#   eslint 10, which pins minimatch ^10 and matches the globs of our own lint config, never input
#   from outside. Drop it once eslint moves to minimatch 11.
# Remove each id once its parent ships without the affected version.
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
    - GHSA-mrhx-c7xc-m3w5
    - GHSA-g3hv-75wg-m249
