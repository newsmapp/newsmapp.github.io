# Weekly catalog link health (Mon 05:00 UTC), reported as a GitHub issue for the owner to review.
# Can also be run by hand from Actions → Scheduled → Run workflow.
name: Scheduled

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Catalog link health
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only reports: the outlet files it touches are not committed; the owner applies changes.
      - run: pnpm catalog:health
      - name: Write the issue body
        run: |
          report=$(printf '%s\n' reports/health-*.json | sort | tail -1)
          {
            echo "Weekly link check of the catalog ($(jq -r '.checked_at' "$report"))."
            echo
            echo "- Checked: $(jq '.results | length' "$report")"
            echo "- With findings: $(jq '.proposals | length' "$report")"
            echo
            echo "Review each finding and update \`data/outlets/\` by hand (or with \`pnpm catalog:health --country XX\` locally). Full JSON report: workflow run artifact."
            echo
            echo "| Outlet | Status | Findings |"
            echo "| --- | --- | --- |"
            # Findings quote remote data (redirect targets): code spans keep it inert, with no links,
            # mentions or table breaks.
            jq -r '.proposals[] | "| `\(.id)` | \(.status) | `\(.findings | join("; ") | gsub("[`|\\n]"; " "))` |"' "$report" | head -300
          } > health-issue.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: catalog-health
          path: reports/
          retention-days: 30
      - name: Open the issue (closing last week's)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create catalog-health --color BFD4F2 --description 'Weekly link health report' --force
          gh issue list --label catalog-health --state open --json number --jq '.[].number' |
            xargs -r -I{} gh issue close {} --comment 'Superseded by the newer weekly report.'
          gh issue create --title "Catalog health $(date -u +%F)" --label catalog-health --body-file health-issue.md
