# Production deploy to GitHub Pages (ADR 0014). The site is fully static: build, audit, upload.
# Triggers:
#   - CI finishing green on main (catalog or code change), so a red build never ships;
#   - workflow_dispatch, for a manual rebuild.
# No secrets. Optional repository variables, baked into the pages at build time:
#   SITE_URL (default: the Pages URL GitHub reports, e.g. a custom domain set in Settings → Pages),
#   ENABLED_LOCALES (default en,pt).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer run waits instead of racing the older one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workflow_run's branch filter matches only the branch *name*: a fork PR from a branch called
    # "main" would pass it. Deploy only pushes to this repository's main that CI passed.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    env:
      ENABLED_LOCALES: ${{ vars.ENABLED_LOCALES || 'en,pt' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # workflow_run: deploy exactly the commit CI tested; otherwise the dispatched ref (main).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # The legal pages print these values: never publish example contacts or an unnamed law.
      - name: Require the owner's site data
        run: |
          if grep -qE 'newsmap\.example|to be confirmed' data/site.json; then
            echo '::error::Fill data/site.json (contact and privacy e-mails, jurisdiction) before deploying'
            exit 1
          fi
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Resolve the site URL
        run: |
          url="${SITE_URL_VAR:-$PAGES_URL}"
          url="${url%/}"
          # Root-relative links need the site at the root of its origin (ADR 0014).
          [[ "$url" =~ ^https://[^/]+$ ]] ||
            { echo "::error::The site must be served from an origin root (custom domain or <org>.github.io repository), got '$url'"; exit 1; }
          echo "SITE_URL=$url" >> "$GITHUB_ENV"
          echo "Building for $url"
        env:
          SITE_URL_VAR: ${{ vars.SITE_URL }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm seo:audit
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
