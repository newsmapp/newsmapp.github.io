# Production deploy. Triggers:
#   - CI finishing green on main (catalog or code change), so a red build never ships;
#   - workflow_dispatch, which the Worker calls after a sponsorship changes (src/server/rebuild.ts)
#     and the owner can run by hand;
#   - workflow_call from scheduled.yml (daily rebuild for expirations).
# Secrets: CLOUDFLARE_API_TOKEN (deploy), CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_D1_READ_TOKEN (snapshot).
# Variables (public, baked into the static pages at build time and passed to the Worker):
#   SITE_URL, TURNSTILE_SITE_KEY (required), ENABLED_LOCALES (default en), ADS_ENABLED (default false).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this rebuild runs (logged only)
        required: false
        default: manual
  workflow_call:
    inputs:
      reason:
        type: string
        required: false
        default: scheduled
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_D1_READ_TOKEN:
        required: true

permissions:
  contents: read

# One deploy at a time; a newer run waits instead of racing the older one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Snapshot, build, migrate, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      ENABLED_LOCALES: ${{ vars.ENABLED_LOCALES || 'en' }}
      ADS_ENABLED: ${{ vars.ADS_ENABLED || 'false' }}
    steps:
      - name: Reason
        run: echo "Deploy reason - ${REASON}"
        env:
          REASON: ${{ inputs.reason || 'CI passed on main' }}
      - name: Require the build-time variables
        run: |
          [[ "$SITE_URL" == https://* && "$SITE_URL" != *newsmap.example* ]] ||
            { echo '::error::Set the SITE_URL repository variable (https://your-domain)'; exit 1; }
          [[ -n "$TURNSTILE_SITE_KEY" && "$TURNSTILE_SITE_KEY" != 1x0000* ]] ||
            { echo '::error::Set the TURNSTILE_SITE_KEY repository variable (real site key)'; exit 1; }
      - uses: actions/checkout@v7
        with:
          # workflow_run: deploy exactly the commit CI tested; otherwise the dispatched ref (main).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Listed sponsorships are baked into the static pages; fail rather than ship an empty snapshot.
      - run: pnpm sponsorships:snapshot --required
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_READ_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
      - run: pnpm build
      - run: pnpm seo:audit
      # Migrations are forward-only and must land before the code that uses them.
      - run: pnpm db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Runtime vars follow the same values the pages were built with.
      - run: >-
          pnpm exec wrangler deploy
          --var "SITE_URL:$SITE_URL"
          --var "ENABLED_LOCALES:$ENABLED_LOCALES"
          --var "ADS_ENABLED:$ADS_ENABLED"
          --var "GITHUB_REPOSITORY:$GITHUB_REPOSITORY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
