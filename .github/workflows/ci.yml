# Every PR and push must pass this. Mirrors `pnpm check` plus the build, SEO, E2E and Lighthouse gates.
name: CI

# Documentation-only changes do not touch the site: skipping them saves Actions minutes
# (private repository). Deploy follows CI, so a docs-only push does not redeploy either.
on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, catalog, unit tests, real build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Any known advisory fails CI, except the reviewed ones listed in pnpm-workspace.yaml.
      - run: pnpm audit
      # wrangler types reads .dev.vars to type the secrets; the example has no real values.
      - run: cp .env.example .dev.vars
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm catalog:validate
      - run: pnpm test:coverage
      # The production catalog must build and audit cleanly, not only the fixtures.
      - run: pnpm build
      - run: pnpm seo:audit

  e2e:
    name: Fixture build, SEO audit, E2E + a11y, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CATALOG_DIR: tests/fixtures/catalog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Local secrets for wrangler dev: Turnstile always-pass test keys, simulated checkout, admin bypass.
      - run: cp .env.example .dev.vars
      - run: pnpm build
      - run: pnpm seo:audit
      - run: pnpm exec playwright install --with-deps chromium
      # Playwright starts the Worker itself (pnpm db:migrate:local && wrangler dev).
      - run: pnpm e2e
      - run: pnpm lhci
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
